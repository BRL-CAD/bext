# Extended checks run weekly only when the default branch has changed.
# Manual dispatch (and explicit re-runs) can force another run of the same SHA.
name: BRL-CAD Weekly

on:
  schedule:
    # Wednesday at 02:30 UTC, matching the binary dependency builds.
    - cron: '30 2 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  changes:
    permissions:
      actions: read
    uses: ./.github/workflows/weekly_changes.yml

  dependency_metadata:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Dependency metadata and supply-chain checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate build scheduling and working-tree cleanup
        run: python3 CMake/tests/test_release_build.py -v

      - name: Validate dependency selection and optional snapshots
        run: python3 CMake/tests/test_dependency_selection.py -v

      - name: Validate committed and staged dependency metadata
        run: python3 CMake/tests/test_dependency_metadata.py -v

      - name: Validate SBOM formats and advisory projections
        run: python3 CMake/tests/test_sbom_formats.py -v

      - name: Install SBOM validators
        run: |
          python3 -m venv "$RUNNER_TEMP/sbom-tools"
          "$RUNNER_TEMP/sbom-tools/bin/python" -m pip install -r CMake/sbom-requirements.txt

      - name: Validate dependency metadata and documentation
        # Source attribution and aggregate license evidence are checked against
        # these pinned trees; the remaining metadata is repository-local.
        run: |
          git submodule update --init --depth 1 -- qt/qt tcl/tcl openimageio/oiio
          cmake -DBEXT_SOURCE_DIR="$GITHUB_WORKSPACE" -DBEXT_DOC_MODE=CHECK -P CMake/GenerateDependencyDocs.cmake

      - name: Generate source SBOMs
        run: cmake -DBEXT_SOURCE_DIR="$GITHUB_WORKSPACE" -DBEXT_SBOM_OUTPUT="$RUNNER_TEMP/bext.spdx.json" -DBEXT_CYCLONEDX_OUTPUT="$RUNNER_TEMP/bext.cdx.json" -P CMake/TestSbom.cmake

      - name: Validate SBOM specifications and parity
        run: |
          cmake -DBEXT_SBOM_INPUT="$RUNNER_TEMP/bext.spdx.json" -P CMake/ValidateSbom.cmake
          "$RUNNER_TEMP/sbom-tools/bin/python" CMake/ValidateSbom.py --spdx "$RUNNER_TEMP/bext.spdx.json" --cyclonedx "$RUNNER_TEMP/bext.cdx.json"

      - name: Generate and validate advisory projections
        run: |
          for format in spdx cdx; do
            python3 CMake/ProjectSbom.py --input "$RUNNER_TEMP/bext.$format.json" --output "$RUNNER_TEMP/bext.conan.$format.json" --report "$RUNNER_TEMP/bext.conan.$format.coverage.json"
          done
          "$RUNNER_TEMP/sbom-tools/bin/python" CMake/ValidateSbom.py --spdx "$RUNNER_TEMP/bext.conan.spdx.json"
          "$RUNNER_TEMP/sbom-tools/bin/python" CMake/ValidateSbom.py --cyclonedx "$RUNNER_TEMP/bext.conan.cdx.json"

      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: bext-spdx-sbom
          path: ${{ runner.temp }}/bext.spdx.json

  linux_configure_presets:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Ubuntu Configure Preset - ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [auto, bundled, minimal, everything]
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup - System
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # Install XCB/OpenGL dev pkgs for Qt - see:
          # https://wiki.qt.io/Building_Qt_6_from_Git
          # https://doc.qt.io/qt-6/linux-requirements.html
          sudo apt-get install flex bison m4 libfontconfig1-dev libfreetype6-dev libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev libxcb-util-dev libxcb-xinerama0-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev
          sudo apt-get install libgl-dev
          sudo apt-get install libinput-dev
          sudo apt-get clean

      - name: Configure
        run: |
          export PATH=$GITHUB_WORKSPACE:$PATH
          cmake --preset ${{ matrix.preset }} -DGIT_SHALLOW_CLONE=ON -DEXT_BUILD_VERBOSE=ON

  windows_std_tools_release:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: MSVC - Standard Tools Release Build
    runs-on: windows-latest
    strategy:
      fail-fast: true
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Checkout
        uses: actions/checkout@v4

      - name: Add github workspace to path
        # https://github.community/t/deprecated-add-path/136621
        run: echo "$ENV{GITHUB_WORKSPACE}" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Add cl.exe to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Validate excluded dependency targets with MSBuild
        run: python CMake/tests/test_release_build.py ReleaseBuildTests.test_excluded_wrappers_visual_studio -v

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -DENABLE_ALL=ON -DBEXT_DISCARD_WORK=ON -DBEXT_BUILD_JOBS=2 -DGIT_SHALLOW_CLONE=ON -DCMAKE_BUILD_TYPE=Release -DEXT_BUILD_VERBOSE=ON
          # We do the following in order to help ensure files are "flushed"
          # to disk before compilation is attempted
          # https://superuser.com/a/1553374/1286142
          powershell Write-VolumeCache C
          powershell Write-VolumeCache D

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Release --parallel 1

  windows_std_tools_debug:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: MSVC - Standard Tools Debug Build
    runs-on: windows-latest
    strategy:
      fail-fast: true
    steps:
      - name: Setup - CMake
        uses: lukka/get-cmake@latest

      - name: Checkout
        uses: actions/checkout@v4

      - name: Add github workspace to path
        # https://github.community/t/deprecated-add-path/136621
        run: echo "$ENV{GITHUB_WORKSPACE}" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Add cl.exe to PATH
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -DENABLE_ALL=ON -DBEXT_DISCARD_WORK=ON -DBEXT_BUILD_JOBS=2 -DGIT_SHALLOW_CLONE=ON -DCMAKE_BUILD_TYPE=Debug -DEXT_BUILD_VERBOSE=ON
          # We do the following in order to help ensure files are "flushed"
          # to disk before compilation is attempted
          # https://superuser.com/a/1553374/1286142
          powershell Write-VolumeCache C
          powershell Write-VolumeCache D

      - name: Build
        shell: cmd
        run: |
          cmake --build build --config Debug --parallel 1
